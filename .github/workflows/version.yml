name: Test and Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read 

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:22.12.0
    steps:
        - uses: actions/checkout@v3
          with:
            node-version: 22.12.0
        - run: npm ci
        - run: npm run build